name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install chroma-mcp dependencies
        working-directory: ./chroma-mcp
        run: npm ci

      - name: Install minimax-mcp dependencies
        working-directory: ./minimax-mcp
        run: npm ci

      - name: Build minimax-mcp
        working-directory: ./minimax-mcp
        run: npm run build

      - name: Check TypeScript (noEmit)
        working-directory: ./minimax-mcp
        run: npx tsc --noEmit
